[env:esp32_32e]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.partitions = no_ota.csv
upload_speed = 460800
monitor_speed = 115200
; Uncomment the next two lines only if the screen shows garbage with the default driver
; (some ESP32-32E boards use an ST7789 screen instead of the ILI9341):
;build_flags =
;  -DLCD_ST7789
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
  adafruit/Adafruit ST7735 and ST7789 Library
