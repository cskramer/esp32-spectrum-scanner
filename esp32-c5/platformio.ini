; Wi-Fi EQ — dual-band version for the RockBase NM-CYD-C5 (ESP32-C5)
; The ESP32-C5 needs Arduino core 3.3+, which comes from the community "pioarduino"
; PlatformIO platform (the official espressif32 platform doesn't support the C5 yet).

[env:nm-cyd-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1   ; send Serial output over the USB-C port (/dev/ttyACM0)
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  paulstoffregen/XPT2046_Touchscreen
  greiman/SdFat
; A display library pulls in the generic Arduino "SD" library, which doesn't support
; the ESP32-C5. This sketch uses SdFat instead, so keep any "SD" library out of the build.
lib_ignore = SD
